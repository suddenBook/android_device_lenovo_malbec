# Game mode thermal policy.
#
# SPDX-FileCopyrightText: The LineageOS Project
# SPDX-License-Identifier: Apache-2.0
#
# ── Why this file is in the device tree and not a blob ───────────────────────
#
# It is plain-text INI, it is device policy rather than proprietary code, and it
# is the one file here anybody will ever want to re-tune. As a blob every tuning
# step would be an opaque 2 KB binary change; as a device-tree file each step is
# a readable diff. thermal-engine-v2 reads it by path, so nothing else changes:
#
#     init.qcom.rc:516
#       thermal-engine-v2 -c /vendor/etc/thermal-engine-malbec-${vendor.thermal.mode}.conf
#     on property:vendor.thermal.mode=*   -> stop/start thermal-switch-engine
#
# The other six profiles (normal, audio, camera, floating, off, skynet) are
# still extracted verbatim. Only this one is ours.
#
# ── ★ SAFETY: what this file is and is not ───────────────────────────────────
#
# This is NOT the over-temperature protection. That lives in the kernel and is
# untouched by anything here — measured on the device: 75 thermal zones, each
# CPU die zone carrying its own TSENS trip points from the DTB, with independent
# cooling devices (cpu-cluster0..3, cpu-hotplug0..4, battery, cdsp, cdsp_hw,
# pm7550ba-bcl). Those act on JUNCTION temperature and cannot be reached from
# userspace. If the silicon is in danger they fire regardless of this file.
#
# `quiet-therm` is a board thermistor, i.e. a proxy for how warm the CHASSIS is
# getting. So every threshold below trades case temperature for sustained clock,
# and nothing below trades away protection.
#
# ── What changed from stock's game profile, and why ──────────────────────────
#
# Owner's decision, in their words: keep clocks high below 60 °C, the tablet can
# take the heat. Three of the knobs from the survey were selected.
#
# Stock's game profile was:
#
#     MON-MSM-CPU1/2   48 °C single step -> 1190400        (37-42% of max)
#     MON-MSM-CPU3     48 °C single step -> 1094400        (34% of max)
#     MON-MSM-GPU      50 °C single step -> 510000000      (44% of max)
#
# i.e. full clock right up to 48 °C and then a cliff. Below the trigger it was
# already unthrottled, so the felt problem was never "it throttles too early" —
# it was the size of the single step. Three changes:
#
#   1. Trigger raised 48 -> 60 °C. The owner's call, and the reason it is safe is
#      the paragraph above: junction protection is elsewhere. Note stock's own
#      `normal` starts at 42 °C, so this is a large move and is deliberate — game
#      mode is opt-in and momentary, `normal` is what the tablet sits in all day.
#   2. The cliff becomes a three-step ramp. The final rung is stock's own value,
#      so the deepest throttle is unchanged; what changed is that reaching it now
#      takes 8 °C instead of happening instantly.
#   3. The GPU gets the same treatment. Stock's game profile handles the GPU
#      IDENTICALLY to `normal` — 50 °C straight to 510 MHz, 44% of the 1150 MHz
#      maximum — which looks like a block that was never tuned for gaming at all,
#      and the GPU is what a game hits first.
#
# ⚠️ Every frequency below is a real entry from this device's own tables, read
# off the running device rather than copied from another profile:
#
#     policy2 (cluster1, cpu2-4)  480000 … 3014400
#     policy5 (cluster2, cpu5-6)  480000 … 2803200
#     policy7 (cluster3, cpu7)    480000 … 2956800   (2841600 is the rung below)
#     GPU                         264000000 … 1150000000
#
# cluster1 and cluster2 share values in stock's profiles and can, because every
# value used is <= 2803200, the lower of the two maxima. cluster3 is the X4 prime
# core and has its own table with different steps — 1920000 exists there,
# 1804800 does not, and using a value that is not in the table would silently
# round.
#
# thresholds_clr sits 3 °C below each threshold. That hysteresis is what stops
# the governor oscillating across a rung; stock uses 2 °C on a 2 °C spacing,
# and this file's rungs are 4 °C apart so 3 °C leaves a real dead band.
#
# ── What was deliberately NOT changed ────────────────────────────────────────
#
# [CHARGE] is stock's, untouched. It is worth knowing that it is 1 °C EARLIER
# than `normal` on every rung (35/37/39/41/47 vs 36/38/40/42/48), which does
# nothing for performance and only makes the tablet charge more slowly while
# you play — it looks like a block copied from another profile without being
# re-aligned. Left alone because the owner picked knobs 1, 3 and 5 and not this
# one; changing it in the same commit would also make the result unattributable.
#
# ── How to tell whether this helped ──────────────────────────────────────────
#
# Before/after, same workload, same ambient, 15 minutes:
#   * quiet-therm and the lenovo_sys_temp front/back/user temps (already logged
#     every 5 s by the driver)
#   * cpufreq/stats/time_in_state deltas per policy
#   * GPU busy percentage and gpuclk distribution
# A frame-rate number alone will not show whether the ramp or the trigger did
# the work.

[CHARGE]
algo_type          monitor
sampling           1000
sensor               quiet-therm
thresholds          35000  37000  39000  41000  47000
thresholds_clr     33000  35000  37000  39000  45000
actions            battery battery battery battery battery
action_info          2          3          4          5         7

[MON-MSM-CPU1]
algo_type        monitor
sampling         1000
sensor           quiet-therm
thresholds        60000 64000 68000
thresholds_clr   57000 61000 65000
actions          cpu-cluster1 cpu-cluster1 cpu-cluster1
action_info      2611200 1920000 1190400

[MON-MSM-CPU2]
algo_type        monitor
sampling         1000
sensor           quiet-therm
thresholds        60000 64000 68000
thresholds_clr   57000 61000 65000
actions          cpu-cluster2 cpu-cluster2 cpu-cluster2
action_info      2611200 1920000 1190400

[MON-MSM-CPU3]
algo_type        monitor
sampling         1000
sensor           quiet-therm
thresholds        60000 64000 68000
thresholds_clr   57000 61000 65000
actions          cpu-cluster3 cpu-cluster3 cpu-cluster3
action_info     2841600 1920000 1094400

[MON-MSM-GPU]
algo_type        monitor
sampling         2000
sensor            quiet-therm
thresholds       60000 64000 68000
thresholds_clr   57000 61000 65000
actions            gpu gpu gpu
action_info      873000000 688000000 510000000
